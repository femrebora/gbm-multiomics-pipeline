# ─────────────────────────────────────────────────────────────────────────────
# GBM Multi-Omics Prognostic Biomarker Pipeline — Configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file defines all parameters for the pipeline.
# Override via CLI (--param value), environment variables, or a custom YAML.
#
# References:
#   Verhaak et al. (2010) Cancer Cell 17:98-110 — GBM subtypes
#   Hegi et al. (2005) NEJM 352:997-1003 — MGMT methylation
#   Liu et al. (2018) Cell 173:400-416 — PanCanAtlas CDR
#   Brennan et al. (2013) Cell 155:462-477 — TCGA GBM
# ─────────────────────────────────────────────────────────────────────────────

# ── Pipeline metadata ────────────────────────────────────────────────────────
pipeline:
  name: "GBM Prognostic Biomarker Discovery"
  version: "0.2.0"
  project_id: "TCGA-GBM"
  random_seed: 42

# ── Data directories ─────────────────────────────────────────────────────────
paths:
  data_dir: "~/gbm_multiomics_data"
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  report_dir: "results/report"
  cache_dir: "~/.cache/gbm_pipeline"

# ── Download configuration ───────────────────────────────────────────────────
download:
  data_types: ["rna-seq", "methylation", "mutations", "cnv", "mirna"]
  include_cdr: true
  fresh: false
  token_file: ""  # path to GDC token, empty for open-access only

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  # Gene filtering
  min_count: 10                    # minimum raw count across samples
  min_samples_expressed: 0.2       # fraction of samples with count > 0
  protein_coding_only: true        # filter to protein-coding genes
  remove_ribosomal: true           # remove ribosomal protein genes
  remove_mitochondrial: true       # remove mitochondrial genes

  # Normalization
  normalization_method: "vst"      # vst | tpm | cpm | quantile
  log_transform: true              # log2(x + pseudocount) after normalization
  pseudocount: 1

  # Batch correction (optional)
  batch_correction: false
  batch_column: "plate_id"

  # QC thresholds
  outlier_iqr_multiplier: 3.0     # IQR multiplier for PCA outlier detection
  max_missing_clinical: 0.3        # max fraction missing clinical data per sample

# ── Differential expression ──────────────────────────────────────────────────
differential_expression:
  # Comparisons to run (each must have condition + reference)
  comparisons:
    - condition: "is_tumor"
      reference: "False"
      label: "Tumor_vs_Normal"

    - condition: "IDH_status"
      reference: "IDH_wildtype"
      label: "IDH_mutant_vs_WT"

    - condition: "MGMT_status"
      reference: "Unmethylated"
      label: "MGMT_methylated_vs_unmethylated"

  # Thresholds
  padj_threshold: 0.05
  lfc_threshold: 1.0               # |log2FC| > this is "significant"
  n_cpus: 4

  # Batch-aware design (include batch in DESeq2 formula)
  batch_aware: false
  batch_column: "plate_id"

# ── Prognostic biomarker discovery ───────────────────────────────────────────
prognostic:
  # Survival endpoints to test
  endpoints:
    - OS     # Overall Survival (primary)
    - PFI    # Progression-Free Interval
    - DSS    # Disease-Specific Survival

  # Univariate Cox
  univariate:
    padj_threshold: 0.05           # BH-corrected p-value cutoff
    min_events_per_group: 10

  # Lasso-Cox feature selection
  lasso:
    n_folds: 10                    # cross-validation folds
    n_lambda: 100                  # lambda grid points
    alpha: 1.0                     # 1 = Lasso, 0 = Ridge, 0.5 = Elastic Net
    max_features: 50               # cap on selected features

  # Multivariate Cox
  multivariate:
    clinical_covariates:
      - "age_at_diagnosis"
      - "IDH_status"
      - "MGMT_status"
      - "gender"
    test_ph_assumption: true       # Schoenfeld residuals

  # Risk stratification
  risk_groups:
    n_groups: 2                    # high/low
    split_method: "median"         # median | optimal_cutpoint | tertile

  # Time-dependent ROC
  time_roc:
    times: [365, 730, 1095]       # 1, 2, 3 years in days

  # External validation
  depmap:
    enabled: true
    depmap_version: "24Q2"

# ── Multi-omics integration ──────────────────────────────────────────────────
multiomics:
  mofa:
    enabled: true
    n_factors: 10
    n_top_features: 5000          # top variable features per omics

  snf:
    enabled: true
    n_clusters_range: [2, 3, 4, 5, 6]
    n_neighbors: 20

  cross_omics_correlation:
    # RNA ~ Methylation: promoters within this distance
    promoter_window_bp: 2000      # TSS ± 2000bp
    # RNA ~ CNV: cis-correlation
    cis_window_bp: 1_000_000      # gene ± 1Mb

# ── Supporting analyses ──────────────────────────────────────────────────────
supporting:
  immune:
    estimate_enabled: true
    # ESTIMATE signature genes (Yoshihara et al. 2013 Nat Commun 4:2612)

  network:
    string_enabled: true
    string_score_threshold: 700    # minimum STRING combined score
    n_hub_genes: 20               # top hub genes to report

  tumor_mutation_burden:
    tmb_genome_size_mb: 38.0      # exome capture size for TMB calculation
    tmb_high_threshold: 10.0      # mutations/Mb

# ── Visualization ────────────────────────────────────────────────────────────
visualization:
  # Global theme
  theme:
    style: "publication"          # publication | presentation | interactive
    dpi: 300
    format: ["pdf", "png"]        # output formats
    font_family: "DejaVu Sans"    # or "Arial", "Helvetica"
    font_size_base: 10
    color_palette: "GBM_custom"   # defined in visualization/theme.py

  # Colors for GBM subtypes
  subtype_colors:
    Classical:   "#E41A1C"        # red
    Mesenchymal: "#377EB8"        # blue
    Proneural:   "#4DAF4A"        # green
    Neural:      "#984EA3"        # purple

  # Colors for clinical groups
  clinical_colors:
    IDH_wildtype: "#D55E00"
    IDH_mutant:   "#009E73"
    MGMT_methylated:   "#0072B2"
    MGMT_unmethylated: "#CC79A7"

  # Volcano plot
  volcano:
    n_label: 20                    # top N genes to label
    lfc_cutoff: 1.0
    padj_cutoff: 0.05

  # KM plot
  km:
    show_ci: true
    show_at_risk: true
    x_breaks_days: 365            # tick every year
    max_time_days: 1825           # 5 years

  # Heatmap
  heatmap:
    n_top_genes: 50
    cluster_rows: true
    cluster_cols: true
    show_row_names: false
    annotation_colors: null       # auto-detected from theme

  # Forest plot
  forest:
    sort_by: "HR"
    show_pvalue: true

# ── Gene Focus (thesis gene spotlight) ────────────────────────────────────────
gene_focus:
  # Genes of interest for thesis spotlight and focused analysis
  genes_of_interest:
    - EGFR
    - PTEN
    - TP53
    - IDH1
    - NF1
    - PDGFRA
    - CDK4
    - MDM2
    - CDKN2A
    - RB1
    - PIK3CA
    - PIK3R1
    - VEGFA
    - CHI3L1
    - MGMT
    - TERT
    - ATRX
    - BRAF
    - MET
    - SOX2

  # Per-gene figure settings
  expression_group_by: "is_tumor"     # or "IDH_status", "subtype"
  survival_endpoint: "OS"
  n_top_ppi_neighbors: 10

  # Rank comparison thresholds
  rank_percentile_thresholds: [1, 5, 10]  # top 1%, 5%, 10%

# ── Report generation ────────────────────────────────────────────────────────
report:
  format: "pdf"                   # pdf | html | both
  include_code: false             # show analysis code in report
  include_supplementary: true
  citation_style: "cell"          # CSL style file for Cell Press journals
  output_basename: "gbm_prognostic_report"
